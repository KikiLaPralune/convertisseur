<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de Conversion d'Unités</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            display: flex;
            justify-content: space-between;
        }

        .converter-container {
            width: 60%;
        }

        .premium-info {
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        .category-list {
            list-style-type: none;
            padding: 0;
        }

        .category-list li {
            margin: 5px 0;
            cursor: pointer;
        }

        .disabled {
            color: gray;
            pointer-events: none;
        }

        .paypal-container {
            width: 30%;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .paypal-container h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- Conversion Tool -->
    <div class="converter-container">
        <h1>Outil de Conversion d'Unités</h1>

        <!-- Premium Information -->
        <div class="premium-info">
            <p>Seuls les utilisateurs premium ont accès à toutes les catégories. Abonnez-vous via PayPal pour débloquer toutes les fonctionnalités !</p>
        </div>

        <!-- Category Selection -->
        <h2>Catégorie :</h2>
        <ul class="category-list">
            <li onclick="selectCategory('distance')">Distance</li>
            <li onclick="selectCategory('temperature')">Température</li>
            <li class="disabled">Poids</li>
            <li class="disabled">Volume</li>
            <li class="disabled">Surface</li>
            <li class="disabled">Temps</li>
            <li class="disabled">Énergie</li>
            <li class="disabled">Vitesse</li>
        </ul>

        <!-- Conversion Inputs -->
        <label for="value">Valeur à convertir :</label>
        <input type="number" id="value" placeholder="Entrez une valeur"><br><br>

        <label for="from">Convertir de :</label>
        <select id="from">
            <!-- Options will be dynamically added based on category -->
        </select><br><br>

        <label for="to">Convertir en :</label>
        <select id="to">
            <!-- Options will be dynamically added based on category -->
        </select><br><br>

        <button onclick="convert()">Convertir</button><br><br>

        <p>Résultat : <span id="result"></span></p>
    </div>

    <!-- PayPal Container -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAaeQ4UcFXpLyVt1UuEiC4T8qC_vyCmnpaEaDhPiUPyTRNazSsXui40Y41Xd-LDhU7_9bgj1eJfTDc81E&components=hosted-buttons&disable-funding=venmo&currency=EUR"></script>
<div id="paypal-container-WPU5B29NBUUJ2"></div>
<script>
  paypal.HostedButtons({
    hostedButtonId: "WPU5B29NBUUJ2",
  }).render("#paypal-container-WPU5B29NBUUJ2")
</script>

    <script>
        let selectedCategory = null;

        // Function to select a category
        function selectCategory(category) {
            if (category === 'distance' || category === 'temperature') {
                selectedCategory = category;
                populateConversionOptions();
            } else {
                alert("Cette catégorie est réservée aux utilisateurs premium. Abonnez-vous via PayPal pour débloquer cette fonctionnalité.");
            }
        }

        // Function to populate conversion options based on the selected category
        function populateConversionOptions() {
            const fromSelect = document.getElementById('from');
            const toSelect = document.getElementById('to');

            // Clear previous options
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            if (selectedCategory === 'distance') {
                const units = ['Mètres', 'Kilomètres', 'Pieds', 'Miles'];
                units.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit;
                    option.text = unit;
                    fromSelect.add(option.cloneNode(true));
                    toSelect.add(option.cloneNode(true));
                });
            } else if (selectedCategory === 'temperature') {
                const units = ['Celsius', 'Fahrenheit', 'Kelvin'];
                units.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit;
                    option.text = unit;
                    fromSelect.add(option.cloneNode(true));
                    toSelect.add(option.cloneNode(true));
                });
            }
        }

        // Function to perform conversion
        function convert() {
            const value = parseFloat(document.getElementById('value').value);
            const fromUnit = document.getElementById('from').value;
            const toUnit = document.getElementById('to').value;

            if (isNaN(value)) {
                document.getElementById('result').textContent = 'Veuillez entrer une valeur valide.';
                return;
            }

            let result = value;

            if (selectedCategory === 'distance') {
                result = convertDistance(value, fromUnit, toUnit);
            } else if (selectedCategory === 'temperature') {
                result = convertTemperature(value, fromUnit, toUnit);
            }

            document.getElementById('result').textContent = `${result} ${toUnit}`;
        }

        // Distance conversion logic (corrected)
        function convertDistance(value, fromUnit, toUnit) {
            const conversions = {
                'Mètres': 1,
                'Kilomètres': 0.001, // 1 mètre = 0.001 kilomètre
                'Pieds': 3.28084, // 1 mètre = 3.28084 pieds
                'Miles': 0.000621371 // 1 mètre = 0.000621371 mile
            };

            const meters = value / conversions[fromUnit];
            return (meters * conversions[toUnit]).toFixed(4); // Rounded to 4 decimal places
        }

        // Temperature conversion logic
        function convertTemperature(value, fromUnit, toUnit) {
            let kelvin;

            if (fromUnit === 'Celsius') {
                kelvin = value + 273.15;
            } else if (fromUnit === 'Fahrenheit') {
                kelvin = (value + 459.67) * 5 / 9;
            } else if (fromUnit === 'Kelvin') {
                kelvin = value;
            }

            if (toUnit === 'Celsius') {
                return (kelvin - 273.15).toFixed(2);
            } else if (toUnit === 'Fahrenheit') {
                return ((kelvin * 9 / 5) - 459.67).toFixed(2);
            } else if (toUnit === 'Kelvin') {
                return kelvin.toFixed(2);
            }
        }
    </script>

</body>
</html>
